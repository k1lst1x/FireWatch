[project]
name = "firewatch"
version = "0.1.0"
description = "AI-assisted wildfire detection and emergency response platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.0.0",
    "pillow>=10.0.0",
    "pydantic-ai>=1.75.0",
    "openai>=1.0.0",
    "ultralytics>=8.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[argon2]>=0.2.0",
    "dill>=0.3",
    "flwr[simulation]>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = ["slow: runs a real Flower simulation (~15s)"]
