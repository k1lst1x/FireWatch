<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D City Fire Monitor - Geospatial Command Engine</title>
    <!-- CesiumJS Primary Stylesheets -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 16, 26, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 90, 0, 0.25);
            padding: 20px;
            border-radius: 8px;
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: auto;
            z-index: 1000;
            max-width: 320px;
        }

        #ui-overlay h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff6a00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #fire-stats {
            font-size: 14px;
            color: #a0aec0;
            line-height: 1.4;
        }

        .back-link {
            font-size: 12px;
            color: #94a3b8;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .back-link:hover { color: #fff; border-color: #ff6a00; }

        .cesium-viewer-bottom {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>

    <div id="ui-overlay">
        <h2>
            <span>System Telemetry</span>
            <a href="/" class="back-link">← App</a>
        </h2>
        <div id="fire-stats">Initializing secure hardware layer sync...</div>
    </div>

    <!-- Cesium Core Distribution Engine -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    
    <!-- System Component Topology Registration -->
    <script src="js/cesiumConfig.js"></script>
    <script src="js/fireService.js"></script>
    <script src="js/app.js" type="module"></script>
</body>
</html>
